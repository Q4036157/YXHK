# 仅监听 204 的 Tailscale 网卡；每个请求另需租户密钥。
server {
    listen 100.105.178.111:3192;
    server_name _;
    location /internal/ {
        proxy_pass http://127.0.0.1:3192;
        client_max_body_size 4k;
        access_log off;
    }
    location = /health { proxy_pass http://127.0.0.1:3192; }
    location / { return 404; }
}
