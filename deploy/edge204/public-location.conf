# 公开入口仅转发退订页面和打开追踪图片，内部接口不经公网发布。
location = /marketing/unsubscribe {
    proxy_pass http://127.0.0.1:3192;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 4k;
    access_log off;
}
location = /marketing/resubscribe {
    proxy_pass http://127.0.0.1:3192;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 4k;
    access_log off;
}
location ~ ^/marketing/track/([A-Za-z0-9_-]{16,128})\.gif$ {
    limit_except GET { deny all; }
    rewrite ^/marketing/track/(.*)$ /email/$1 break;
    proxy_pass http://100.123.30.26:3034;
    proxy_set_header Host 127.0.0.1:3034;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    access_log off;
}
